name: Auto Merge Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize] # Trigger when a PR is opened or new commits are pushed to it

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # SAFETY FILTER: Only auto-merge PRs submitted by you (GuruMachanica)
    if: github.event.pull_request.user.login == 'GuruMachanica'
    steps:
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Uses the default GITHUB_TOKEN which has write access in pull_request_target
        run: |
          echo "Auto-merging Pull Request #${{ github.event.pull_request.number }} opened by ${{ github.event.pull_request.user.login }}..."
          gh pr merge ${{ github.event.pull_request.number }} --merge --admin -y
          echo "PR #${{ github.event.pull_request.number }} successfully merged!"
